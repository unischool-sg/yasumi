name: Deploy (product)

# product ブランチへの push（= PR マージ）で self-hosted runner 上で自動デプロイする。
on:
  push:
    branches: [product]
  workflow_dispatch: {}

# デプロイの多重実行を防ぐ（前のデプロイは完了させる）。
concurrency:
  group: deploy-product
  cancel-in-progress: false

jobs:
  deploy:
    # サーバー(unischool)に常駐する self-hosted runner で実行する。
    runs-on: [self-hosted, unischool]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: サーバーの環境変数を読み込む
        # 秘密情報は GitHub ではなくサーバー上の ~/yasumi.env で管理する。
        run: |
          if [ ! -f "$HOME/yasumi.env" ]; then
            echo "::error::$HOME/yasumi.env がありません。DEPLOY.md の runner セットアップを参照してください。"
            exit 1
          fi
          cp "$HOME/yasumi.env" .env

      - name: ビルド & 起動
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --build

      - name: PostgreSQL の起動を待機
        run: |
          for i in $(seq 1 30); do
            if docker compose --env-file .env -f docker/docker-compose.yml exec -T postgres pg_isready >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::postgres が起動しませんでした"; exit 1

      - name: マイグレーション & 初期データ
        run: |
          docker compose --env-file .env -f docker/docker-compose.yml exec -T api bun run backend/src/infrastructure/db/migrate.ts
          docker compose --env-file .env -f docker/docker-compose.yml exec -T api bun run backend/src/infrastructure/db/seed-areas.ts

      - name: ヘルスチェック
        run: |
          for i in $(seq 1 15); do
            if docker compose --env-file .env -f docker/docker-compose.yml exec -T api \
                 bun -e 'const r=await fetch("http://localhost:3000/health"); if(!r.ok) process.exit(1)' >/dev/null 2>&1; then
              echo "health ok"; exit 0
            fi
            sleep 2
          done
          echo "::error::health チェックに失敗しました"; exit 1

      - name: 古いイメージを削除
        if: always()
        run: docker image prune -f
