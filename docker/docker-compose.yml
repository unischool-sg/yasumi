name: yasumi

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LIFF_CHANNEL_ID: ${LIFF_CHANNEL_ID}
      ADMIN_LINE_USER_IDS: ${ADMIN_LINE_USER_IDS}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    depends_on:
      - postgres

  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8083}:80"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_LIFF_ID: ${VITE_LIFF_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"

  landing:
    build:
      context: ..
      dockerfile: docker/landing.Dockerfile
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-8081}:80"

  postgres:
    image: postgres:17
    restart: unless-stopped
    # 本番ではホストに公開しない（api とは compose 内部ネットワークで接続 / docker/SPEC.md §7）。
    # ローカルで直接接続したい場合は override で ports を足す。
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
