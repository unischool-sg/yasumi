name: yasumi

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LIFF_CHANNEL_ID: ${LIFF_CHANNEL_ID}
      ADMIN_LINE_USER_IDS: ${ADMIN_LINE_USER_IDS}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      # 先生ダッシュボード API。未設定なら /api/school は無効（安全にドーマント）。
      SCHOOL_JWT_SECRET: ${SCHOOL_JWT_SECRET}
      # LINE 受信メッセージの Discord 転送先（秘密・未設定なら転送しない）。
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      # 友だち追加・学校購読・学校登録などの活動通知先（秘密・別チャンネル）。
      DISCORD_EVENTS_WEBHOOK_URL: ${DISCORD_EVENTS_WEBHOOK_URL}
      # フロー定期実行のログ送信先（秘密・別チャンネル・未設定なら送らない）。
      DISCORD_FLOW_WEBHOOK_URL: ${DISCORD_FLOW_WEBHOOK_URL}
      # オブジェクトストレージ（RustFS/S3互換・ロゴ保存）。秘密は SSH で .env に設定。
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      # Google Ads コンバージョン（秘密・未設定なら gclid は保存のみ）。
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
      GOOGLE_ADS_CONVERSION_ACTION: ${GOOGLE_ADS_CONVERSION_ACTION}
    depends_on:
      - postgres

  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8083}:80"

  school:
    build:
      context: ..
      dockerfile: docker/school.Dockerfile
      args:
        VITE_SCHOOL_API_BASE_URL: ${VITE_SCHOOL_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${SCHOOL_PORT:-8085}:80"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_LIFF_ID: ${VITE_LIFF_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"

  landing:
    build:
      context: ..
      dockerfile: docker/landing.Dockerfile
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        PUBLIC_LIFF_ID: ${PUBLIC_LIFF_ID}
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-8081}:80"

  postgres:
    image: postgres:17
    restart: unless-stopped
    # 本番ではホストに公開しない（api とは compose 内部ネットワークで接続 / docker/SPEC.md §7）。
    # ローカルで直接接続したい場合は override で ports を足す。
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
